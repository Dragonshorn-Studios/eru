services:
  eru:
    build:
      context: .
      dockerfile: Dockerfile
    image: eru:local
    user: "1000:1000"
    ports:
      - "${ERU_PORT:-3000}:3000"
    environment:
      ERU_HOST: 0.0.0.0
      ERU_PORT: "3000"
      ERU_SQLITE_PATH: ${ERU_SQLITE_PATH:-/data/eru.sqlite}
      ERU_OPENCODE_BIN: ${ERU_OPENCODE_BIN:-/opt/opencode/.opencode/bin/opencode}
      # OpenCode reads $XDG_DATA_HOME/opencode/auth.json — put it on the
      # eru-data volume so provider keys saved on /config survive restarts
      # inside the read-only container.
      XDG_DATA_HOME: ${XDG_DATA_HOME:-/data/xdg}
      # The image is read-only; HOME must be writable (Bun cache under ~/.cache).
      HOME: /data
      ERU_UI_PASSWORD: ${ERU_UI_PASSWORD:?set ERU_UI_PASSWORD in .env}
      ERU_UI_SESSION_SECRET: ${ERU_UI_SESSION_SECRET:?set ERU_UI_SESSION_SECRET in .env}
      ERU_FORGE_TOKEN_KEY: ${ERU_FORGE_TOKEN_KEY:-}
      ERU_OPENCODE_TIMEOUT_MS: ${ERU_OPENCODE_TIMEOUT_MS:-}
      ERU_OPENCODE_MODEL: ${ERU_OPENCODE_MODEL:-}
      ERU_OPENCODE_ASK_MODEL: ${ERU_OPENCODE_ASK_MODEL:-}
      ERU_OPENCODE_MAP_MODEL: ${ERU_OPENCODE_MAP_MODEL:-}
      ERU_GITHUB_APP_ID: ${ERU_GITHUB_APP_ID:-}
      ERU_GITHUB_APP_PRIVATE_KEY: ${ERU_GITHUB_APP_PRIVATE_KEY:-}
      ERU_GITHUB_APP_PRIVATE_KEY_FILE: ${ERU_GITHUB_APP_PRIVATE_KEY_FILE:-}
      ERU_GITHUB_APP_INSTALLATION_ID: ${ERU_GITHUB_APP_INSTALLATION_ID:-}
      ERU_UI_USER: ${ERU_UI_USER:-}
    volumes:
      - eru-data:/data
      - eru-opencode:/opt/opencode
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  eru-data:
  eru-opencode:
